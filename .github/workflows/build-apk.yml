name: Build & Publish TEJ FOOD Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Capacitor Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 21 ]; then
            echo "Java 21 or newer is required for Capacitor Android 8. Detected: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK file
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          cp "$APK_PATH" release-apk/TejFoodProducts-ERP-debug.apk
          ls -lh release-apk/TejFoodProducts-ERP-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TejFoodProducts-ERP-debug-apk
          path: release-apk/TejFoodProducts-ERP-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v2.4.0-build-${{ github.run_number }}
          name: TEJ FOOD PRODUCTS ERP v2.4.0 (Build #${{ github.run_number }})
          body: |
            **TEJ FOOD PRODUCTS - आटा ERP Android Debug APK**
            - सीधे अपने Android फोन पर डाउनलोड करके इंस्टॉल करें।
            - लाइव मोबाइल सर्वर सिंक + 100% ऑफ़लाइन लोकल स्टोरेज शामिल।
          files: release-apk/TejFoodProducts-ERP-debug.apk
          prerelease: false
